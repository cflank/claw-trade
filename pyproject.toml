[project]
name = "claw-trade"
version = "1.0.1"
description = "claw-trade control migration workspace"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.17.50",
    "baostock>=0.9.1,<1",
    "cryptography>=48.0.0",
    "fastapi>=0.128.0,<0.129.0",
    "loguru>=0.7.2",
    "matplotlib>=3.10.8",
    "mootdx>=0.11.7,<1",
    "mplfinance>=0.12.10b0",
    "openviking==0.3.5",
    "pandas>=2.2.3",
    "pandas-ta>=0.4.71b0",
    "pdfkit>=1.0.0",
    "pypandoc>=1.15",
    "pymongo>=4.10,<5",
    "pytest>=8.0",
    "markdown>=3.8",
    "python-multipart>=0.0.22,<0.0.23",
    "requests>=2.32.3",
    "tushare>=1.4.24,<2",
    "uvicorn>=0.40.0,<0.41.0",
    "yfinance>=0.2.54",
    "duckdb>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claw_trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
