[project]
name = "claw-trade"
version = "0.1.0"
description = "claw-trade control migration workspace"
requires-python = ">=3.12"
dependencies = [
    "openviking==0.3.5",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claw_trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
