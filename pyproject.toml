[project]
name = "claw-trade"
version = "0.1.0"
description = "claw-trade control migration workspace"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.17.50",
    "fastapi>=0.115.0",
    "loguru>=0.7.2",
    "matplotlib>=3.10.8",
    "mootdx>=0.11.7,<1",
    "mplfinance>=0.12.10b0",
    "openviking==0.3.5",
    "pandas>=2.2.3",
    "pandas-ta>=0.4.71b0",
    "pymongo>=4.10,<5",
    "pytest>=8.0",
    "requests>=2.32.3",
    "tushare>=1.4.24,<2",
    "uvicorn>=0.30.0",
    "yfinance>=0.2.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claw_trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
